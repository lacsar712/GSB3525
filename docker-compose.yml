version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: elderly-care-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: elderly_care
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: elderly-care-backend
    ports:
      - "8525:8080"
    depends_on:
      - db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/elderly_care?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: elderly-care-frontend
    ports:
      - "3525:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
